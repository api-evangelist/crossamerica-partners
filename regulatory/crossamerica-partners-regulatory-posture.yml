summary: >-
  CrossAmerica Partners LP (NYSE: CAPL) is a wholesale motor-fuel distributor and convenience-store
  real-estate operator, not a software company, and its public surface is a 26-page corporate site.
  The horizontal regulatory layer is almost entirely absent: no SBOM, no support-lifetime commitment,
  no VPAT or accessibility conformance report (only a self-declaration that the site was "designed
  with WCAG 2.0 Level A & AA standards in mind"), no AI transparency or training-data statement, no
  Global Privacy Control statement, no subprocessor list, no DPA, no data-residency statement, no
  incident-notification commitment, no transparency report, and no notice-and-action channel. The
  privacy policy was last modified September 2017 and its only rights mechanism is an e-mail address
  for California Civil Code §1798.83 "shine the light" requests.
