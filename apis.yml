description: >-
  CrossAmerica Partners LP (NYSE: CAPL) is a U.S. wholesale distributor of motor fuels, operator of
  convenience stores, and owner and lessee of real estate used in the retail distribution of motor
  fuels. Headquartered in Allentown, Pennsylvania and formed in 2012, it distributes branded (Exxon,
  Mobil, BP, Shell, Valero, Citgo, Marathon, Phillips 66) and unbranded petroleum to approximately
  1,600 locations across 34 states, owns or leases about 900 sites, and runs seven convenience-store
  brands at 340 locations in 17 states. CrossAmerica publishes no public API, developer portal or
  machine-readable contract; its only integration surface is a credential-gated Dealer Portal
  (account balance, pricing notifications, fuel and real-estate invoices, EFTs) hosted on a
  third-party platform, with logins issued by a Territory Manager under a dealer agreement.
